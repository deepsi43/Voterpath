<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoterPath – Andhra Pradesh Election Hub</title>
  <meta name="description" content="VoterPath – Your intelligent guide to the Andhra Pradesh election process, timelines, leaders, and real-time politician profiles."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d1f3c;
      --navy-light: #152c52;
      --navy-mid: #1e3a8a;
      --gold: #c9a84c;
      --gold-light: #f0c96e;
      --gold-pale: #fdf6e3;
      --cream: #fafaf7;
      --text: #1a202c;
      --text-muted: #64748b;
      --white: #ffffff;
      --green: #059669;
      --red: #dc2626;
      --amber: #d97706;
      --blue-soft: #eff6ff;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-mid) 100%);
      position: fixed;
      left: 0; top: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 4px 0 20px rgba(0,0,0,0.2);
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(201,168,76,0.3);
    }
    .sidebar-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .sidebar-logo p {
      color: rgba(255,255,255,0.5);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    .sidebar-emblem {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 20px 12px;
    }
    .nav-label {
      color: rgba(255,255,255,0.3);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 12px 12px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-bottom: 4px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .nav-item.active {
      background: linear-gradient(135deg, var(--gold), #a8832c);
      color: var(--navy);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(201,168,76,0.3);
    }
    .nav-icon { font-size: 1.1rem; width: 22px; text-align: center; }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      font-size: 0.72rem;
      text-align: center;
    }

    /* MAIN CONTENT */
    .main {
      margin-left: 260px;
      flex: 1;
      min-height: 100vh;
    }
    .topbar {
      background: var(--white);
      padding: 16px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
    }
    .topbar-badge {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .content { padding: 36px; }

    /* PAGE HEADER */
    .page-header { margin-bottom: 32px; }
    .page-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .page-header p { color: var(--text-muted); font-size: 1rem; }
    .gold-line { width: 56px; height: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; margin: 12px 0; }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 36px; }
    .stat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
    .stat-value { font-size: 2.4rem; font-weight: 800; color: var(--navy); margin: 8px 0 4px; }
    .stat-sub { font-size: 0.8rem; color: var(--text-muted); }

    /* SECTION CARDS */
    .section-card {
      background: var(--white);
      border-radius: 14px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .section-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ELECTION TIMELINE */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--gold), var(--navy-mid));
    }
    .timeline-item { position: relative; margin-bottom: 24px; }
    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 4px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--white);
      box-shadow: 0 0 0 2px var(--gold);
    }
    .timeline-item h4 { font-size: 0.95rem; font-weight: 700; color: var(--navy); }
    .timeline-item .date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold);
      margin-top: 2px;
    }
    .timeline-item p { font-size: 0.83rem; color: var(--text-muted); margin-top: 4px; }

    /* PROCESS STEPS */
    .process-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .process-step {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 18px;
      border-radius: 10px;
      background: var(--blue-soft);
      border: 1px solid #dbeafe;
    }
    .step-num {
      width: 36px; height: 36px; min-width: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .process-step h4 { font-size: 0.9rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .process-step p { font-size: 0.8rem; color: var(--text-muted); }

    /* MINISTER CARDS */
    .ministers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .minister-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .minister-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .minister-card-top {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 28px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .minister-img {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold);
      margin-bottom: 14px;
    }
    .minister-name { color: var(--white); font-weight: 700; font-size: 1rem; text-align: center; }
    .minister-role { color: var(--gold); font-size: 0.78rem; font-weight: 500; text-align: center; margin-top: 4px; }
    .minister-card-bottom { padding: 16px 20px; }
    .minister-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .meta-item { text-align: center; }
    .meta-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .meta-value { font-size: 0.85rem; font-weight: 700; color: var(--navy); }
    .party-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold-pale), #fef3c7);
      color: var(--navy);
      border: 1px solid #fde68a;
    }
    .view-profile-btn {
      width: 100%;
      padding: 9px 0;
      border-radius: 8px;
      border: 2px solid var(--navy);
      background: transparent;
      color: var(--navy);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .view-profile-btn:hover {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
    }

    /* MLA TABLE */
    .region-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .region-tab {
      padding: 8px 18px;
      border-radius: 24px;
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .region-tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      border-color: var(--navy);
      color: var(--white);
    }
    .mla-table { width: 100%; border-collapse: collapse; }
    .mla-table th {
      text-align: left;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
      font-size: 0.77rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mla-table th:first-child { border-radius: 8px 0 0 0; }
    .mla-table th:last-child { border-radius: 0 8px 0 0; }
    .mla-table td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; color: var(--text); }
    .mla-table tr:hover td { background: var(--blue-soft); }
    .source-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
      background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3);
      margin-top: 8px;
    }
    .profile-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .profile-btn:hover { opacity: 0.85; transform: scale(1.03); }

    /* PROFILE PAGE */
    .profile-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      border-radius: 14px;
      padding: 36px;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 28px;
    }
    .profile-avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--navy);
      border: 4px solid var(--gold);
      flex-shrink: 0;
    }
    .profile-header h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--white); }
    .profile-header p { color: var(--gold); font-size: 0.9rem; margin-top: 6px; }
    .profile-content {
      background: var(--white);
      border-radius: 14px;
      padding: 32px;
      box-shadow: var(--shadow);
      line-height: 1.7;
    }
    .profile-content h2, .profile-content h3 { color: var(--navy); margin: 20px 0 10px; }
    .profile-content h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
    .profile-content h3 { font-size: 1.1rem; border-left: 4px solid var(--gold); padding-left: 12px; }
    .profile-content ul { padding-left: 20px; }
    .profile-content li { margin-bottom: 6px; color: var(--text-muted); }
    .profile-content p { color: var(--text-muted); margin-bottom: 10px; }
    .profile-content strong { color: var(--text); }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid var(--navy);
      color: var(--navy);
      font-weight: 700;
      background: transparent;
      cursor: pointer;
      margin-bottom: 24px;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .back-btn:hover { background: var(--navy); color: var(--white); }

    /* LOADING */
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 20px;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: 0.95rem; }

    /* CHAT */
    .chat-wrap { max-width: 820px; }
    .chat-messages {
      background: var(--white);
      border-radius: 14px;
      padding: 24px;
      min-height: 400px;
      max-height: 480px;
      overflow-y: auto;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .chat-msg { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .chat-msg.user .chat-avatar { background: linear-gradient(135deg, var(--navy), var(--navy-mid)); color: var(--gold); }
    .chat-msg.bot .chat-avatar { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy); }
    .chat-bubble {
      max-width: 70%;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .chat-msg.user .chat-bubble {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--white);
      border-bottom-right-radius: 4px;
    }
    .chat-msg.bot .chat-bubble {
      background: var(--blue-soft);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .chat-bubble h1, .chat-bubble h2, .chat-bubble h3 { color: var(--navy); font-size: 1rem; margin-bottom: 6px; }
    .chat-bubble ul { padding-left: 18px; }
    .chat-bubble li { margin-bottom: 4px; }
    .chat-input-wrap { display: flex; gap: 12px; }
    .chat-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid var(--border);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border 0.2s;
    }
    .chat-input:focus { border-color: var(--navy); }
    .send-btn {
      padding: 14px 24px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--gold);
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn:hover:not(:disabled) { opacity: 0.85; }

    /* DATES */
    .dates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .date-card {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--white);
    }
    .date-icon { font-size: 1.5rem; }
    .date-event { font-size: 0.88rem; font-weight: 700; color: var(--navy); }
    .date-val { font-size: 0.82rem; color: var(--gold); font-weight: 600; margin-top: 3px; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }

    /* WELCOME BANNER */
    .welcome-banner {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, #2563eb 100%);
      border-radius: 16px;
      padding: 40px;
      color: var(--white);
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .welcome-banner::after {
      content: '🏛️';
      position: absolute;
      right: 40px;
      font-size: 7rem;
      opacity: 0.08;
    }
    .welcome-banner h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 8px; color: var(--white); }
    .welcome-banner p { color: rgba(255,255,255,0.7); font-size: 0.95rem; max-width: 520px; line-height: 1.6; }
    .welcome-banner .gold-tag {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .ministers-grid { grid-template-columns: repeat(2, 1fr); }
      .process-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API = '';  // same-origin (FastAPI serves at /)

// -- UTILS --
function md(text) {
  try { return { __html: marked.parse(text || '') }; }
  catch (e) { return { __html: text }; }
}

// ---- COMPONENTS ----
function Spinner() {
  return (
    <div className="loading-box">
      <div className="spinner"></div>
      <p className="loading-text">VoterPath AI is researching & scraping data…</p>
    </div>
  );
}

function TopBar({ title }) {
  return (
    <div className="topbar">
      <span className="topbar-title">{title}</span>
      <span className="topbar-badge">🏛️ Andhra Pradesh · 2024 Assembly</span>
    </div>
  );
}

// ---- PAGES ----
function Dashboard() {
  const [dates, setDates] = useState([]);
  const [stats, setStats] = useState({stats:[], party_seats:[]});
  useEffect(() => {
    fetch('/api/election-dates').then(r=>r.json()).then(d=>setDates(d.dates||[]));
    fetch('/api/constituency-stats').then(r=>r.json()).then(d=>setStats(d));
  }, []);

  const dateIcons = { info:'📋', warning:'⚠️', primary:'🗳️', success:'✅' };

  return (
    <>
      <TopBar title="Election Dashboard" />
      <div className="content">
        <div className="welcome-banner">
          <div>
            <span className="gold-tag">LIVE · ANDHRA PRADESH 2024</span>
            <h2>Your Complete Election Hub</h2>
            <p>Track the assembly numbers, official timelines, and step-by-step election process for the 16th Andhra Pradesh Legislative Assembly.</p>
          </div>
        </div>

        <div className="stats-grid">
          {[
            {label:'Legislative Assembly', value:'16th', sub:'Current Session'},
            {label:'Total Constituencies', value:'175', sub:'Single-phase Election'},
            {label:'Current Tenure', value:'2024–29', sub:'5-Year Term'},
            {label:'Ruling Alliance', value:'NDA', sub:'TDP + Jana Sena + BJP'},
          ].map(s => (
            <div className="stat-card" key={s.label}>
              <div className="stat-label">{s.label}</div>
              <div className="stat-value">{s.value}</div>
              <div className="stat-sub">{s.sub}</div>
            </div>
          ))}
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'28px'}}>
          <div className="section-card">
            <h3>📅 Key Election Dates</h3>
            <div className="dates-grid">
              {dates.map(d => (
                <div className="date-card" key={d.event}>

function MinisterProfile({ name, role, img, onBack }) {

  useEffect(() => {

      .then(r => r.json())

  const initials = name.split(' ').filter(Boolean).slice(0, 2).map(n => n[0]).join('');

  const sourceLabel = {static:'✅ Curated Profile', wikipedia:'🌐 Live Wikipedia', llm:'🤖 AI Generated', cache:'📦 Cached'}[source] || '';

      <TopBar title="Minister Profile" />
      <div className="content">
        <button className="back-btn" onClick={onBack}>← Back to Ministers</button>
        <div className="profile-header">
          <div style={{flexShrink:0}}>
            {img && !imgError ? (

                alt={name}

          <div>
            <p style={{color:'var(--gold-light)', fontSize:'0.78rem', letterSpacing:'2px', marginBottom:'6px'}}>AP CABINET MINISTER</p>
            <h2 style={{fontFamily:"'Playfair Display', serif", fontSize:'2rem', color:'var(--white)'}}>{name}</h2>
            <p style={{color:'rgba(255,255,255,0.65)', marginTop:'6px'}}>{role} · Live profile researched by VoterPath AI</p>

function ChatAssistant() {
  const [messages, setMessages] = useState([
    { role:'bot', content:"Hello! I'm **VoterPath AI**. I can explain the election process, answer questions about AP politics, or look up politicians using real-time web search and scraping. Ask me anything!" }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput('');
    setMessages(prev => [...prev, {role:'user', content:userMsg}]);
    setLoading(true);

    const history = messages.map(m => ({role: m.role==='user'?'user':'assistant', content: m.content}));
    try {
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: userMsg, history})
      });
      const data = await res.json();
      setMessages(prev => [...prev, {role:'bot', content: data.reply}]);
    } catch (e) {
      setMessages(prev => [...prev, {role:'bot', content:'Sorry, an error occurred.'}]);
    }
    setLoading(false);
  };

  return (
    <>
      <TopBar title="AI Election Assistant" />
      <div className="content">
        <div className="page-header">
          <h2>VoterPath Assistant</h2>
          <div className="gold-line"></div>
          <p>Ask questions about election timelines, voter registration, or AP politicians. The AI can search the web and scrape profiles in real time.</p>
        </div>
        <div className="chat-wrap">
          <div className="chat-messages">
            {messages.map((m, i) => (
              <div key={i} className={`chat-msg ${m.role}`}>
                <div className="chat-avatar">{m.role==='user'?'👤':'🗳️'}</div>
                <div className="chat-bubble" dangerouslySetInnerHTML={md(m.content)} />
              </div>
            ))}
            {loading && (
              <div className="chat-msg bot">
                <div className="chat-avatar">🗳️</div>
                <div className="chat-bubble" style={{color:'var(--text-muted)'}}>
                  <em>Searching & processing…</em>
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>
          <div className="chat-input-wrap">
            <input
              className="chat-input"
              placeholder="Ask about elections, voter registration, AP politicians…"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key==='Enter' && send()}
              disabled={loading}
            />
            <button className="send-btn" onClick={send} disabled={loading}>Send ➤</button>
          </div>
        </div>
      </div>
    </>
  );
}

// ---- SIDEBAR ITEMS ----
const NAV = [
  {id:'Dashboard',       icon:'📊', label:'Election Dashboard'},
  {id:'Ministers',       icon:'🏛️', label:'State Ministers'},
  {id:'MLAs',            icon:'📍', label:'Regional MLAs'},
  {id:'Chat',            icon:'💬', label:'AI Assistant'},
];

// ---- APP ROOT ----
function App() {
  const [page, setPage] = useState('Dashboard');
  const [selectedMLA, setSelectedMLA] = useState(null);
  const [selectedMinister, setSelectedMinister] = useState(null);
  const [selectedMinisterRole, setSelectedMinisterRole] = useState('');
  const [selectedMinisterImg, setSelectedMinisterImg] = useState('');

  const handleSelectMLA = (name) => {
    setSelectedMLA(name);
    setPage('MLAProfile');
  };

  const handleSelectMinister = (name, role, img) => {
    setSelectedMinister(name);
    setSelectedMinisterRole(role);
    setSelectedMinisterImg(img);
    setPage('MinisterProfile');
  };

  const titles = {
    Dashboard:'Election Dashboard',
    Ministers:'State Ministers',
    MLAs:'Regional MLAs',
    MLAProfile:'MLA Profile',
    Chat:'AI Assistant',
  };

  return (
    <>
      <nav className="sidebar">
        <div className="sidebar-logo">
          <div className="sidebar-emblem">🗳️</div>
          <h1>VoterPath</h1>
          <p>Andhra Pradesh Election Hub</p>
        </div>
        <div className="sidebar-nav">
          <div className="nav-label">Navigation</div>
          {NAV.map(n => (
            <button
              key={n.id}
              className={`nav-item${page===n.id || (page==='MLAProfile' && n.id==='MLAs') || (page==='MinisterProfile' && n.id==='Ministers')?' active':''}`}
              onClick={() => {
                setPage(n.id);
                if(n.id !== 'MLAProfile') setSelectedMLA(null);
                if(n.id !== 'MinisterProfile') { setSelectedMinister(null); }
              }}
            >
              <span className="nav-icon">{n.icon}</span>
              {n.label}
            </button>
          ))}
          {selectedMLA && (
            <button className={`nav-item${page==='MLAProfile'?' active':''}`} onClick={() => setPage('MLAProfile')}>
              <span className="nav-icon">👤</span>
              MLA: {selectedMLA.split(' ')[0]}…
            </button>
          )}
          {selectedMinister && (
            <button className={`nav-item${page==='MinisterProfile'?' active':''}`} onClick={() => setPage('MinisterProfile')}>
              <span className="nav-icon">🏛️</span>
              Minister: {selectedMinister.split(' ').slice(-1)[0]}…
            </button>
          )}
        </div>
        <div className="sidebar-footer">
          Powered by Gemini AI · TinyFish Scraper<br/>© 2024 VoterPath
        </div>
      </nav>

      <div className="main">
        {page === 'Dashboard' && <Dashboard />}
        {page === 'Ministers' && <Ministers onSelectMinister={handleSelectMinister} />}
        {page === 'MLAs' && <RegionalMLAs onSelectMLA={handleSelectMLA} />}
        {page === 'MLAProfile' && selectedMLA && <MLAProfile name={selectedMLA} onBack={() => setPage('MLAs')} />}
        {page === 'MinisterProfile' && selectedMinister && <MinisterProfile name={selectedMinister} role={selectedMinisterRole} img={selectedMinisterImg} onBack={() => setPage('Ministers')} />}
        {page === 'Chat' && <ChatAssistant />}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
